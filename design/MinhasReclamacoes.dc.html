<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Minhas reclamações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D5E6B}a:hover{color:#08434D}
input::placeholder{color:#7A898D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F7; font-family: Manrope, system-ui, sans-serif; color: #15282D; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 56px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #E1E7E9">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Minhas reclamações</h1>
    <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: #F4F6F7; border: 1px solid #E1E7E9">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <label for="mr-busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar reclamação</label>
      <input id="mr-busca" type="text" placeholder="Buscar por protocolo ou assunto" style="flex: 1; min-width: 0; border: 0; outline: none; font: 500 14px Manrope, system-ui, sans-serif; color: #15282D; background: transparent">
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; overflow: hidden">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <a href="Detalhes.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border: 1px solid #E1E7E9; border-radius: 16px; text-decoration: none; color: #15282D">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-size: 12px; font-weight: 700; color: #4E6166">{{it.proto}}</span>
          <span style="{{it.badge}}">{{it.status}}</span>
        </div>
        <div style="font-size: 15px; font-weight: 700">{{it.title}}</div>
        <div style="display: flex; gap: 14px; font-size: 12px; color: #4E6166">
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/></svg>{{it.place}}</span>
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{it.date}}</span>
        </div>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 40px 16px; text-align: center; font-size: 14px; color: #4E6166">Nenhuma reclamação com este status.</div>
    </sc-if>
  </div>
  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E1E7E9; padding: 8px 8px 26px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B6B70; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
    <a href="NovaReclamacao.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B6B70; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Nova</a>
    <a href="MinhasReclamacoes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #0D5E6B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/></svg>Acompanhar</a>
    <a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #5B6B70; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todas' };
  }
  renderVals() {
    const tones = {
      'Em análise': { bg: '#FFF1D1', fg: '#7A4B00' },
      'Em andamento': { bg: '#DCEBFA', fg: '#1D4F8C' },
      'Resolvida': { bg: '#DCF2E4', fg: '#17603A' },
      'Pendente': { bg: '#FCE1E1', fg: '#9B1C1C' }
    };
    const all = [
      { proto: '#2026-0852', title: 'Ruído fora do horário', status: 'Em análise', place: 'Rua das Flores, 123', date: 'Hoje, 22:41', group: 'abertas' },
      { proto: '#2026-0847', title: 'Caminhão bloqueando garagem', status: 'Em andamento', place: 'Av. Central, 480', date: 'Hoje, 10:30', group: 'abertas' },
      { proto: '#2026-0831', title: 'Poeira excessiva de demolição', status: 'Resolvida', place: 'Rua do Sol, 77', date: 'Ontem, 16:15', group: 'resolvidas' },
      { proto: '#2026-0812', title: 'Risco estrutural em muro', status: 'Pendente', place: 'Rua das Flores, 140', date: '24 set, 09:00', group: 'abertas' },
      { proto: '#2026-0790', title: 'Entulho na calçada', status: 'Resolvida', place: 'Tv. das Palmeiras, 12', date: '18 set, 14:20', group: 'resolvidas' }
    ];
    const f = this.state.filter;
    const items = all
      .filter((x) => f === 'todas' || x.group === f || (f === 'analise' && x.status === 'Em análise'))
      .map((x) => ({ ...x, badge: { padding: '3px 10px', borderRadius: '999px', fontSize: '12px', fontWeight: 700, background: tones[x.status].bg, color: tones[x.status].fg } }));
    const defs = [
      { id: 'todas', label: 'Todas' },
      { id: 'abertas', label: 'Abertas' },
      { id: 'analise', label: 'Em análise' },
      { id: 'resolvidas', label: 'Resolvidas' }
    ];
    const filters = defs.map((d) => {
      const on = d.id === f;
      return {
        ...d,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ filter: d.id }),
        style: { height: '36px', padding: '0 14px', borderRadius: '999px', flex: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: '13px', fontWeight: on ? 700 : 600, border: on ? '1.5px solid #0D5E6B' : '1.5px solid #D5DEE0', background: on ? '#0D5E6B' : '#FFFFFF', color: on ? '#FFFFFF' : '#3A4E53' }
      };
    });
    return { items, filters, empty: items.length === 0 };
  }
}
</script>
</body>
</html>
