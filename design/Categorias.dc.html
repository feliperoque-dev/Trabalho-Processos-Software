<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Categorias</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D5E6B}a:hover{color:#08434D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F7; font-family: Manrope, system-ui, sans-serif; color: #15282D; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 52px 20px 16px; background: #FFFFFF; border-bottom: 1px solid #E1E7E9">
    <div style="display: flex; align-items: center; margin: 0 -8px">
      <a href="NovaReclamacao.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0D5E6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 700">Nova reclamação · Obra</div>
      <div style="width: 44px"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #4E6166">Passo 1 de 5: Categoria</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div style="height: 6px; border-radius: 3px; background: #0D5E6B"></div>
      <div style="height: 6px; border-radius: 3px; background: #D5DEE0"></div>
      <div style="height: 6px; border-radius: 3px; background: #D5DEE0"></div>
      <div style="height: 6px; border-radius: 3px; background: #D5DEE0"></div>
      <div style="height: 6px; border-radius: 3px; background: #D5DEE0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px">
    <div>
      <h1 style="margin: 0 0 4px; font-size: 20px; font-weight: 800">Qual é o problema?</h1>
      <p style="margin: 0; font-size: 14px; color: #4E6166">Selecione a categoria que melhor descreve a situação.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.cardStyle}}">
          <span style="{{c.iconStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
          <span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{c.label}}</span>
          <span style="font-size: 12px; color: #4E6166; line-height: 1.35">{{c.hint}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 14px 20px 30px; background: #FFFFFF; border-top: 1px solid #E1E7E9">
    <a href="Formulario.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0D5E6B; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Próximo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'ruido' };
  }
  renderVals() {
    const list = [
      { id: 'ruido', label: 'Ruído fora do horário', hint: 'Máquinas antes das 7h ou após 22h', d: 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12' },
      { id: 'poeira', label: 'Poeira e sujeira', hint: 'Sem tela de proteção ou umidificação', d: 'M7 16a4 4 0 1 1 .8-7.9A5 5 0 0 1 17.5 9 3.5 3.5 0 0 1 17 16zM8 19h.01M12 20h.01M16 19h.01' },
      { id: 'entulho', label: 'Entulho na via', hint: 'Caçamba irregular ou material na rua', d: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13' },
      { id: 'vibracao', label: 'Vibração e rachaduras', hint: 'Danos em imóveis vizinhos', d: 'M8 4h8v16H8zM4 8v8M20 8v8' },
      { id: 'risco', label: 'Risco estrutural', hint: 'Muro, andaime ou tapume instável', d: 'M12 3 2 20h20zM12 10v4M12 17h.01' },
      { id: 'caminhoes', label: 'Caminhões e máquinas', hint: 'Bloqueio de garagem ou rua', d: 'M3 6h11v10H3zM14 10h4l3 3v3h-7zM5 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0M15 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0' },
      { id: 'calcada', label: 'Calçada obstruída', hint: 'Pedestres forçados a ir pela rua', d: 'M4 20h16M6 20V9l6-5 6 5v11M10 14h4' },
      { id: 'outros', label: 'Outros', hint: 'Descreva no próximo passo', d: 'M5 12h.01M12 12h.01M19 12h.01' }
    ];
    const cats = list.map((c) => {
      const on = this.state.picked === c.id;
      return {
        ...c,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ picked: c.id }),
        cardStyle: { display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '8px', padding: '14px', minHeight: '124px', textAlign: 'left', borderRadius: '16px', cursor: 'pointer', fontFamily: 'inherit', color: '#15282D', boxSizing: 'border-box', background: on ? '#E8F4F5' : '#FFFFFF', border: on ? '2px solid #0D5E6B' : '1.5px solid #E1E7E9' },
        iconStyle: { width: '40px', height: '40px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? '#0D5E6B' : '#DFF0F1', color: on ? '#FFFFFF' : '#0D5E6B' }
      };
    });
    return { cats };
  }
}
</script>
</body>
</html>
